name: Hyas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # node-sass 7 has no prebuilt binaries for macOS arm64 or Windows + Node 18,
        # so the build is checked on Linux, the same platform Netlify deploys from.
        os: [ubuntu-latest]
        node: [16.x, 18.x]

    steps:
      - name: Check out Hyas project
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      # The project ships a yarn.lock (no package-lock.json), so `npm ci` cannot run.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      # hugo-installer puts the Hugo binary in node_modules/.bin/hugo/
      - name: Add Hugo to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin/hugo" >> "$GITHUB_PATH"

      # Existing style/markdown lint warnings are reported but don't block the build.
      - name: Run Hyas test script
        run: npm test
        continue-on-error: true

      - name: Build production website
        run: npm run build
